// Entry point for all fork-only build changes. Upstream build files stay untouched.
// Use: ./gradlew --init-script fork/android/fork.init.gradle :androidApp:assembleProdRelease
// Or install the loader in ~/.gradle/init.d/ (see fork/README.md) to apply it to every build.

// The loader and --init-script can both be active. Apply only once.
if (gradle.ext.has('mbtaForkApplied')) return
gradle.ext.mbtaForkApplied = true

def forkAndroidDir = buildscript.sourceFile.parentFile

gradle.apply(from: new File(forkAndroidDir, 'identity.gradle'))
gradle.apply(from: new File(forkAndroidDir, 'liveUpdate/liveUpdate.gradle'))
