// Adds the Live Update feature to :androidApp without changes to upstream files.
// Applied by fork.init.gradle.

def liveUpdateDir = buildscript.sourceFile.parentFile

gradle.allprojects { project ->
    if (project.path != ':androidApp') return

    project.plugins.withId('com.android.application') {
        // Use getByName: in a Groovy script, `main { }` resolves to the script's own main method.
        def sourceSets = project.android.sourceSets
        sourceSets.getByName('main').kotlin.directories.add(new File(liveUpdateDir, 'src').path)
        sourceSets.getByName('main').res.directories.add(new File(liveUpdateDir, 'res').path)
        sourceSets.getByName('test').kotlin.directories.add(new File(liveUpdateDir, 'test').path)

        // The main and flavor source sets already have manifests, and the release source set
        // has the fork identity manifest. Add this manifest to every variant instead.
        def manifest = new File(liveUpdateDir, 'AndroidManifest.xml').path
        project.androidComponents.onVariants(project.androidComponents.selector().all()) { variant ->
            variant.sources.manifests.addStaticManifestFile(manifest)
        }

        // NotificationCompat.ProgressStyle, setRequestPromotedOngoing and setShortCriticalText
        // need androidx.core 1.17 or later.
        project.dependencies.add('implementation', 'androidx.core:core-ktx:1.18.0')
    }
}

// Format and check the fork Kotlin code with the same rules as upstream (spotlessCheck).
gradle.rootProject { root ->
    root.pluginManager.withPlugin('com.diffplug.spotless') {
        def spotless = root.extensions.getByName('spotless')
        def kotlinExtension =
            spotless.class.classLoader.loadClass('com.diffplug.gradle.spotless.KotlinExtension')
        spotless.format('forkKotlin', kotlinExtension) {
            target('fork/**/*.kt')
            ktfmt().kotlinlangStyle()
        }
    }
}
