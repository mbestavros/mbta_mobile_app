name: Fork Upstream Canary

# Fork-only workflow. Rebases the fork onto upstream mbta/mobile_app main in a scratch checkout,
# then runs the fork's checks and release build. Nothing is pushed. A failure opens an issue
# labelled upstream-canary (or comments on the open one), and the next pass closes it. This shows
# an upstream change that breaks the fork days after upstream merges it, not at the next rebase.
# Docs: fork/README.md ("Upstream canary")

on:
  schedule:
    # Mondays and Thursdays, 09:17 UTC (off the hour, when scheduled runs are less often delayed).
    - cron: '17 9 * * 1,4'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-upstream-canary
  cancel-in-progress: true

jobs:
  canary:
    name: Rebase onto upstream and check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      upstream_sha: ${{ steps.rebase.outputs.upstream_sha }}
      rebase: ${{ steps.rebase.outcome }}
      check: ${{ steps.check.outcome }}
      build: ${{ steps.build.outcome }}
    steps:
      # TODO: Remove the ca-certificates upgrade once
      # https://github.com/actions/runner-images/issues/15018 is resolved
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --only-upgrade ca-certificates
          sudo apt-get install -y librsvg2-bin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rebase onto upstream main
        id: rebase
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mbta/mobile_app.git
          git fetch --no-tags upstream main
          echo "upstream_sha=$(git rev-parse upstream/main)" >> "${GITHUB_OUTPUT}"
          if ! git -c user.name='github-actions[bot]' \
              -c user.email='41898208+github-actions[bot]@users.noreply.github.com' \
              rebase upstream/main; then
            {
              echo "### Rebase conflict"
              echo
              git diff --name-only --diff-filter=U | sed 's/^/- /'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "Rebased $(git rev-list --count upstream/main..HEAD) fork commits onto $(git rev-parse --short upstream/main)" \
            >> "${GITHUB_STEP_SUMMARY}"
      # After the rebase, so the wrapper and Java version are upstream's latest.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # No dependency cache: a canary should see what a clean rebase sees.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - name: Check fork code
        id: check
        run: |
          ./gradlew --no-daemon --no-build-cache \
            --init-script fork/android/fork.init.gradle \
            :spotlessForkKotlinCheck \
            :androidApp:testProdDebugUnitTest --tests '*liveUpdate*'
      - name: Build prod release
        id: build
        run: |
          ./gradlew --no-daemon --no-build-cache \
            --init-script fork/android/fork.init.gradle \
            :androidApp:assembleProdRelease
          fork/android/release/check-apk.sh \
            androidApp/build/outputs/apk/prod/release/androidApp-prod-release-unsigned.apk

  report:
    name: Report
    needs: canary
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Runs no repository code: it only reads the canary's outputs and calls the GitHub API.
    steps:
      - name: Open, update or close the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.canary.result }}
          UPSTREAM_SHA: ${{ needs.canary.outputs.upstream_sha }}
          REBASE: ${{ needs.canary.outputs.rebase }}
          CHECK: ${{ needs.canary.outputs.check }}
          BUILD: ${{ needs.canary.outputs.build }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          label=upstream-canary
          run_url="${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID}"
          upstream_url="https://github.com/mbta/mobile_app/commit/${UPSTREAM_SHA:-main}"
          open="$(gh issue list --repo "${repo}" --label "${label}" --state open \
            --json number --jq '.[0].number // empty')"

          if [ "${RESULT}" = success ]; then
            if [ -n "${open}" ]; then
              gh issue close "${open}" --repo "${repo}" \
                --comment "Passes again on upstream ${upstream_url} ([run](${run_url}))."
            fi
            exit 0
          fi

          if [ "${REBASE}" != success ]; then
            stage="The rebase onto upstream main failed (a conflict, or the fetch failed)."
          elif [ "${CHECK}" != success ]; then
            stage="Fork code fails to compile, format or pass its tests on upstream main."
          elif [ "${BUILD}" != success ]; then
            stage="The prod release build or the APK check fails on upstream main."
          else
            stage="The canary job ended with ${RESULT}."
          fi
          body="$(printf '%s\n\n- Upstream: %s\n- Run: %s\n\n%s' \
            "${stage}" "${upstream_url}" "${run_url}" \
            "See fork/README.md (Upstream canary) and fork/android/liveUpdate/README.md (Upstream contracts).")"

          if [ -n "${open}" ]; then
            # A failure that lasts would comment on every run. Skip it when the latest note already
            # reports the same stage on the same upstream commit.
            last="$(gh issue view "${open}" --repo "${repo}" --json body,comments \
              --jq '([.body] + [.comments[].body]) | last')"
            if [[ "${last}" == *"${upstream_url}"* && "${last}" == *"${stage}"* ]]; then
              echo "Issue #${open} already reports this failure on this upstream commit."
              exit 0
            fi
            gh issue comment "${open}" --repo "${repo}" --body "${body}"
          else
            gh label create "${label}" --repo "${repo}" --color B60205 \
              --description "Fork breaks on upstream main" --force
            gh issue create --repo "${repo}" --label "${label}" \
              --title "Upstream canary: fork breaks on upstream main" --body "${body}"
          fi
